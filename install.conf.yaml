- clean: ["~"]

- link:
    ~/.profile: profile
    ~/.ssh/config:
      path: ssh/config
      create: true
    ~/.zshenv: zshenv
    ~/.zshrc: zshrc
    ~/.Xresources: Xresources
    ~/.xinitrc: xinitrc
    ~/.config/nvim:
      create: true
      path: config/nvim
    ~/.config/polybar:
      create: true
      path: config/polybar
    ~/.config/sxhkd:
      create: true
      path: config/sxhkd
    ~/.config/alacritty:
      create: true
      path: config/alacritty
    ~/.config/mpd:
      create: true
      path: config/mpd
    ~/.config/ncmpcpp:
      create: true
      path: config/ncmpcpp
    ~/.config/mpv:
      create: true
      path: config/mpv
    ~/.config/zathura:
      create: true
      path: config/zathura
    ~/.config/sway:
      create: true
      path: config/sway
    ~/.config/qutebrowser/config.py:
      reate: true
      path: config/qutebrowser/config.py
    ~/.config/waybar:
      path: config/waybar
      create: true
    ~/.config/kitty:
      create: true
      path: config/kitty
    ~/.config/yabai:
      create: true
      path: config/yabai
    ~/.yabairc:
      create: true
      path: config/yabai/yabairc
    ~/.skhdrc:
      create: true
      path: config/yabai/skhdrc
    ~/.ideavimrc:
      create: true
      path: config/.ideavimrc
    ~/.icons/default:
      create: true
      path: icons/default
    ~/.config/tmux:
      create: true
      path: config/tmux
    ~/.config/niri:
      create: true
      path: config/niri
    ~/.config/mako:
      create: true
      path: config/mako
    # song-notify: enable with `systemctl --user enable --now song-notify`
    ~/.local/bin/song-notify:
      create: true
      path: config/song-notify/song-notify
    ~/.config/systemd/user/song-notify.service:
      create: true
      path: config/song-notify/song-notify.service
    # FreeCAD (dev build, user data dir v27-1): macros, add-ons, CAM assets (machines, tools)
    ~/.local/share/FreeCAD/v27-1/Macro:
      create: true
      path: config/freecad/Macro
    ~/.local/share/FreeCAD/v27-1/Mod:
      create: true
      path: config/freecad/Mod
    ~/.local/share/FreeCAD/v27-1/CamAssets:
      create: true
      path: config/freecad/CamAssets
    # dnc_gui (binary: build ~/src/3nt3/dnc_gui and copy build/dnc_gui to ~/.local/bin)
    ~/.local/share/applications/dnc_gui.desktop:
      create: true
      path: config/applications/dnc_gui.desktop

- shell:
    # dnc_gui rewrites its settings file, so it is copied once instead of linked
    - command: "[ -e ~/.config/3nt3/DncGui.conf ] || install -Dm644 config/dnc_gui/DncGui.conf ~/.config/3nt3/DncGui.conf"
      description: dnc_gui default settings
